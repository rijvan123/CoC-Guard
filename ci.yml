name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.1"
          pip install -r requirements.txt
          pip install -e .
      - name: Unit and end-to-end tests
        run: python -m pytest -q
      - name: Figures from the reported values
        run: python -m cocguard figures --source paper --out figures_reported

  smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.1"
          pip install -r requirements.txt
          pip install -e .
      - name: Smoke reproduction on synthetic stand-ins
        run: bash scripts/reproduce_smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: results_smoke/
