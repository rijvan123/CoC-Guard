# Smoke-test configuration: the complete pipeline on synthetic stand-ins in minutes on a CPU.
# Results obtained with this file are NOT comparable to the paper.
_base_: default.yaml

seeds: [11, 23]
paths:
  processed: data/processed_smoke
  results: results_smoke

model:
  hidden_dim: 32
  temporal_layers: 1
  graph_layers: 1
  ffn_dim: 64
  max_events: 64

training:
  max_epochs: 4
  stage1_epochs: 1
  warmup_epochs: 1
  patience: 2
  batch_size: 32
  lr: 2.0e-3
  static_max_epochs: 6
  static_lr: 1.0e-3
  static_batch_size: 128

screening:
  lambda_grid_step: 0.25
  tau_grid: [0.30, 1.50, 0.03]

replay:
  adapt_epochs: 1

counterfactual:
  repetitions: 3
  max_investigations: 8
  shap_permutations: 2
  budget: 3

custody:
  n_base_histories: 300

evaluation:
  bootstrap_replicates: 200
  latency_warmup: 3
  latency_runs: 10
  latency_sizes: [10, 25, 50]
